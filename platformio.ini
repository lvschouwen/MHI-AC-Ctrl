; MHI-AC-Ctrl -- PlatformIO project configuration
;
; Phase 1 of the improvement programme; see
; docs/superpowers/specs/2026-07-25-mhi-ac-ctrl-improvement-design.md sections 3 and 5.1.
;
; Arduino IDE is no longer supported. Keeping it meant keeping the .ino layout,
; and the .ino layout is what blocked CI.

[platformio]
default_envs = d1_mini

; ---------------------------------------------------------------------------
; Dependency baseline, audited 2026-07-25 (spec section 3)
;
; knolleary/PubSubClient is deliberately NOT used. Issue #747 (publish_P()
; crashes on ESP8266 with a PROGMEM payload) was filed in 2020 and is still
; open, and there has been no code release since v2.8 in May 2020. This project
; calls publish_P() with PSTR() payloads throughout, which is exactly that bug.
; ---------------------------------------------------------------------------
[common]
lib_deps =
	hmueller01/PubSubClient3@3.3.0
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@4.0.6

[esp8266]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
; The README reports better SPI stability at 160 MHz.
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = -Wall
; Warnings are errors for our own code only. Applying -Werror to the framework
; and third-party libraries would make a dependency bump able to break the
; build for something we cannot fix.
build_src_flags = -Werror
; Guard the OTA budget. Later phases add WiFiManager and HA discovery; with no
; spare board, "the firmware got too big to OTA" must be a build failure, not a
; discovery made on a live AC.
extra_scripts = post:scripts/check_flash_size.py
custom_max_firmware_bytes = 460000

[env:d1_mini]
extends = esp8266

; ---------------------------------------------------------------------------
; Host tests. Pure logic only -- no Arduino, no hardware. Runs in CI.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror

; ---------------------------------------------------------------------------
; Build-only environments covering the #ifdef matrix (spec section 5.1).
; Nothing previously verified that these combinations still compile.
; ---------------------------------------------------------------------------
[ci]
extends = esp8266

[env:ci-extended-frame]
extends = ci
build_flags = ${esp8266.build_flags} -D USE_EXTENDED_FRAME_SIZE=true

[env:ci-enhanced-resolution]
extends = ci
build_flags = ${esp8266.build_flags} -D ENHANCED_RESOLUTION=true

; TEMP_MEASURE_PERIOD > 0 is what pulls OneWire/DallasTemperature into the
; build at all; the default d1_mini env never compiles that code.
[env:ci-ds18x20-sensor]
extends = ci
build_flags = ${esp8266.build_flags} -D TEMP_MEASURE_PERIOD=60

[env:ci-ds18x20-troom]
extends = ci
build_flags = ${esp8266.build_flags} -D TEMP_MEASURE_PERIOD=60 -D ROOM_TEMP_DS18X20

[env:ci-poweron-when-changing-mode]
extends = ci
build_flags = ${esp8266.build_flags} -D POWERON_WHEN_CHANGING_MODE=true

[env:ci-continue-without-mqtt]
extends = ci
build_flags = ${esp8266.build_flags} -D CONTINUE_WITHOUT_MQTT=true

; Home Assistant's MQTT climate uses its own lower-case mode names, and a
; build for it overrides the payload text. That must not redefine a macro.
[env:ci-custom-payloads]
extends = ci
build_flags =
	${esp8266.build_flags}
	-D POWERON_WHEN_CHANGING_MODE=true
	-D PAYLOAD_POWER_OFF=\"off\"
	-D PAYLOAD_MODE_AUTO=\"auto\"
	-D PAYLOAD_MODE_DRY=\"dry\"
	-D PAYLOAD_MODE_COOL=\"cool\"
	-D PAYLOAD_MODE_FAN=\"fan_only\"
	-D PAYLOAD_MODE_HEAT=\"heat\"

; The config_defaults.h route itself, with a fixture that fails if the file is
; read twice. Local builds with a real src/config_defaults.h shadow the fixture.
[env:ci-config-defaults]
extends = ci
build_flags = ${esp8266.build_flags} -I test/fixtures/config_defaults

; Everything at once -- the combination most likely to break, and the one that
; sets the flash-size high-water mark.
[env:ci-all-options]
extends = ci
build_flags =
	${esp8266.build_flags}
	-D USE_EXTENDED_FRAME_SIZE=true
	-D ENHANCED_RESOLUTION=true
	-D TEMP_MEASURE_PERIOD=60
	-D ROOM_TEMP_DS18X20
	-D POWERON_WHEN_CHANGING_MODE=true
	-D CONTINUE_WITHOUT_MQTT=true
